name: Wrong or missing titles
description: A station with a recipe shows wrong titles, late titles, or none.
labels: [broken]
body:
  - type: input
    id: recipe
    attributes:
      label: Station or recipe
      description: Its name, or the file in stations/ (ⓘ in the player shows which recipe is used).
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What Soundfolk shows, what the station's website shows, and when (with your time zone).
    validations:
      required: true
